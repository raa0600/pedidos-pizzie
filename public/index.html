<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LE PIZZIE · Pedidos</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=1">
  <link rel="preload" as="image" href="/pizza.png">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="marca">
      <span class="icono-pizza" aria-hidden="true"></span>
      <span>LE PIZZIE</span>
    </div>
    <button id="btn-carrito" class="btn btn-primario">
      Carrito <span id="badge" class="badge">0</span>
    </button>
  </header>

  <main id="menu" class="contenedor"></main>

  <div id="overlay" class="overlay oculto"></div>
  <aside id="panel" class="panel oculto">
    <div class="panel-head">
      <h2>Tu pedido</h2>
      <button id="btn-cerrar" class="btn-icono">✕</button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </aside>

  <!-- Modal para elegir mitades -->
  <div id="modal-mitad" class="modal oculto">
    <div class="modal-overlay" data-cerrar-modal></div>
    <div class="modal-contenido">
      <div class="modal-head">
        <h2>Pizza por mitades</h2>
        <button class="btn-icono" data-cerrar-modal type="button">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-sub">Elige dos sabores distintos, uno para cada mitad.</p>

        <div class="mitad-selector">
          <div class="mitad-panel">
            <label class="mitad-label">Primera mitad</label>
            <div id="mitad-1-lista" class="mitad-lista"></div>
          </div>
          <div class="mitad-panel">
            <label class="mitad-label">Segunda mitad</label>
            <div id="mitad-2-lista" class="mitad-lista"></div>
          </div>
        </div>

        <div class="mitad-resumen">
          <div class="mitad-preview">
            <span id="mitad-1-nombre" class="mitad-nombre">—</span>
            <span class="mitad-bar"></span>
            <span id="mitad-2-nombre" class="mitad-nombre">—</span>
          </div>
          <div class="mitad-precio">
            <span>Precio</span>
            <strong id="mitad-precio">$0.00</strong>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-cerrar-modal type="button">Cancelar</button>
        <button class="btn btn-primario" id="btn-agregar-mitad" type="button" disabled>
          Agregar al carrito
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast oculto"></div>

  <script src="app.js"></script>
</body>
</html>
